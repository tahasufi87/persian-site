<title>Persian Store</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#1a1d24;
    --accent:#3b82f6;
    --text:#e8e9ec;
    --muted:#8a8f98;
    --green:#22c55e;
    --surface0:#0f1115;
    --surface1:#22252d;
    --border:#2a2e37;
    --header-bg:#12141a;
    --danger:#ef4444;
    --shadow:0 2px 6px rgba(0,0,0,.3);
  }
  html[data-theme="light"]{
    --bg:#e9eaed;
    --card:#d9dbe0;
    --accent:#2563eb;
    --text:#1e2330;
    --muted:#6b7280;
    --green:#16a34a;
    --surface0:#f0f1f3;
    --surface1:#cfd2d8;
    --border:#aeb2ba;
    --header-bg:#e9eaed;
    --danger:#dc2626;
    --shadow:none;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Vazirmatn', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg,var(--header-bg) 90%,transparent);
    padding:20px 16px 12px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }
  header h1{
    margin:0 0 10px;
    font-size:22px;
    letter-spacing:.5px;
  }
  header .count{
    color:var(--muted);
    font-size:13px;
    margin-bottom:10px;
  }
  #search{
    width:100%;
    max-width:420px;
    padding:12px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface1);
    color:var(--text);
    font-size:15px;
    outline:none;
    margin-bottom:12px;
  }
  #search:focus{border-color:var(--accent);}
  #chips{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    max-width:900px;
    margin:0 auto 10px;
    padding:0 8px;
  }
  .chip{
    padding:7px 14px;
    border-radius:999px;
    background:var(--surface1);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
    transition:background .15s ease, color .15s ease;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  #sortRow{
    display:flex;
    justify-content:center;
    gap:8px;
  }
  #sortRow .chip{ font-size:12px; padding:6px 12px; }

  #platformRow{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:12px;
  }
  #platformRow .platform-chip{
    font-size:14px;
    font-weight:bold;
    padding:8px 24px;
  }
  #platformRow .platform-chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* popular strip */
  #popularWrap{
    max-width:1200px;
    margin:14px auto 4px;
    padding:0 16px;
  }
  #popularWrap h3{
    font-size:14px;
    color:var(--muted);
    margin:0 0 8px;
    font-weight:normal;
  }
  #popularStrip{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:8px;
    -webkit-overflow-scrolling:touch;
  }
  .pop-card{
    flex:0 0 auto;
    width:90px;
    background:var(--card);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    text-align:center;
  }
  .pop-cover{
    width:100%;
    aspect-ratio:3/4;
    background:var(--surface1);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .pop-cover img{ width:100%; height:100%; object-fit:cover; }
  .pop-title{
    font-size:10px;
    padding:5px 4px;
    line-height:1.3;
  }

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:14px;
    padding:16px;
    max-width:1200px;
    margin:0 auto;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    scroll-margin-top:140px;
  }
  .card:active{transform:scale(.97);}
  .cover-wrap{
    width:100%;
    aspect-ratio:3/4;
    background:var(--surface1);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .cover-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .cover-wrap svg{
    width:40%;
    opacity:.35;
  }
  .new-badge{
    position:absolute;
    top:6px;
    right:6px;
    background:var(--danger);
    color:#fff;
    font-size:10px;
    padding:3px 7px;
    border-radius:999px;
  }
  .title{
    padding:8px 10px 4px;
    font-size:13px;
    line-height:1.4;
    text-align:center;
    color:var(--text);
  }
  .title .tick{ color:var(--green); }
  .genre-tag{
    text-align:center;
    font-size:11px;
    color:var(--accent);
    padding-bottom:8px;
  }
  .add-btn{
    display:block;
    width:calc(100% - 16px);
    margin:0 8px 8px;
    padding:8px 0;
    border:none;
    border-radius:8px;
    background:var(--border);
    color:var(--text);
    font-size:12px;
    font-family:inherit;
    cursor:pointer;
  }
  .add-btn.selected{
    background:var(--accent);
    color:#fff;
  }
  .trailer-btn{
    display:block;
    width:calc(100% - 16px);
    margin:0 8px 10px;
    padding:8px 0;
    border-radius:8px;
    background:transparent;
    border:1px solid var(--green);
    color:var(--green);
    font-size:12px;
    font-family:inherit;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
  }
  #empty{
    display:none;
    text-align:center;
    color:var(--muted);
    padding:40px 10px;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:20px 20px 100px;
    line-height:2;
  }
  footer .credit{
    display:inline-block;
    margin-top:4px;
    opacity:.7;
    font-size:10px;
    letter-spacing:.2px;
  }

  /* alphabet jump nav */
  #alphaNav{
    position:fixed;
    top:50%;
    left:4px;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:2px;
    z-index:15;
    background:rgba(26,29,36,.7);
    border-radius:10px;
    padding:4px 2px;
    max-height:70vh;
    overflow-y:auto;
  }
  #alphaNav button{
    background:none;
    border:none;
    color:var(--muted);
    font-size:10px;
    padding:2px 4px;
    cursor:pointer;
    font-family:inherit;
  }

  /* scroll to top */
  #topBtn{
    position:fixed;
    bottom:80px;
    left:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    border:none;
    font-size:18px;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  #topBtn.show{ display:flex; }

  /* floating cart bar */
  #cartBar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--header-bg);
    border-top:1px solid var(--border);
    padding:12px 16px;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    z-index:20;
  }
  #cartBar.show{ display:flex; }
  #cartCount{
    font-size:14px;
    color:var(--text);
  }
  #cartActions{ display:flex; gap:8px; }
  #clearCartBtn{
    background:var(--border);
    color:var(--muted);
    border:none;
    border-radius:999px;
    padding:10px 14px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  #cartBtn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:10px 20px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
  }

  /* modal */
  #overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:30;
    padding:16px;
  }
  #overlay.show{ display:flex; }
  #modal{
    background:var(--card);
    border-radius:14px;
    padding:20px;
    max-width:420px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
  }
  #modal h2{
    margin:0 0 14px;
    font-size:17px;
    text-align:center;
  }
  #modal input{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface0);
    color:var(--text);
    font-size:14px;
    margin-bottom:6px;
    outline:none;
    font-family:inherit;
  }
  #modal input:focus{ border-color:var(--accent); }
  #nameError{
    color:var(--danger);
    font-size:12px;
    min-height:16px;
    margin-bottom:6px;
  }
  #selectedList{
    list-style:none;
    padding:0;
    margin:10px 0 16px;
    max-height:180px;
    overflow-y:auto;
  }
  #selectedList li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--surface0);
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:6px;
    font-size:13px;
  }
  #selectedList button{
    background:none;
    border:none;
    color:var(--danger);
    font-size:16px;
    cursor:pointer;
    padding:0 4px;
  }
  .modal-actions{
    display:flex;
    gap:10px;
  }
  .modal-actions button{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
  }
  #closeModal{
    background:var(--border);
    color:var(--text);
  }
  #copyModal{
    background:var(--border);
    color:var(--text);
  }
  #sendModal{
    background:var(--accent);
    color:#fff;
  }
  #copyToast{
    position:fixed;
    bottom:100px;
    left:50%;
    transform:translateX(-50%);
    background:var(--green);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    display:none;
    z-index:50;
  }
  #copyToast.show{ display:block; }

  /* theme toggle */
  #themeToggle{
    position:fixed;
    top:14px;
    left:14px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:25;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
</style>
</head>

<button id="themeToggle" title="تغییر تم">🌙</button>

<footer><span class="credit">طراحی سایت: طاها صوفی</span></footer>

<div id="alphaNav"></div>
<button id="topBtn">↑</button>

<div id="cartBar">

  <div id="cartActions">
    <button id="clearCartBtn">پاک کردن</button>

  </div>
</div>

<div id="overlay">

function slug(name){
  return name.replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase();
}

function makeCard(game){
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'g-' + game.c.toLowerCase() + '-' + slug(game.n);
  card.dataset.name = game.n.toLowerCase();
  card.dataset.genre = game.g;
  card.dataset.console = game.c;

  const coverWrap = document.createElement('div');
  coverWrap.className = 'cover-wrap';
  coverWrap.innerHTML = placeholderSVG;
  if(game.isNew){
    const badge = document.createElement('div');
    badge.className = 'new-badge';
    badge.textContent = 'جدید';
    coverWrap.appendChild(badge);
  }

  const cleanName = game.n.replace(/\s*\(.*?\)\s*/g,'');
  const hash = trailers[game.n];

  const title = document.createElement('div');
  title.className = 'title';
  title.innerHTML = hash ? `${cleanName} <span class="tick">✅</span>` : cleanName;

  const genreTag = document.createElement('div');
  genreTag.className = 'genre-tag';
  genreTag.textContent = game.g;

  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = selected.has(game.n) ? '✓ اضافه شد' : '+ افزودن به لیست';
  if(selected.has(game.n)) addBtn.classList.add('selected');
  addBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleSelect(game.n, addBtn);
  });
  btnByName[game.n] = addBtn;

  const trailerLink = document.createElement('a');
  trailerLink.className = 'trailer-btn';
  trailerLink.textContent = '▶ تریلر';
  trailerLink.target = '_blank';
  trailerLink.rel = 'noopener';
  trailerLink.href = hash
    ? `https://www.aparat.com/v/${hash}`
    : `https://www.aparat.com/result/${encodeURIComponent(cleanName + ' تریلر')}`;
  trailerLink.addEventListener('click', (e) => e.stopPropagation());

  card.appendChild(coverWrap);
  card.appendChild(title);
  card.appendChild(genreTag);
  card.appendChild(addBtn);
  card.appendChild(trailerLink);
  grid.appendChild(card);
  coverMap[game.c + '|' + game.n] = { wrap: coverWrap, name: game.n };
  return coverWrap;
}

const SMS_NUMBER = '0910340487';
const selected = new Set();
const btnByName = {};
const coverMap = {};

function toggleSelect(name, btn){
  if(selected.has(name)){
    selected.delete(name);
    btn.classList.remove('selected');
    btn.textContent = '+ افزودن به لیست';
  }else{
    selected.add(name);
    btn.classList.add('selected');
    btn.textContent = '✓ اضافه شد';
  }
  updateCartBar();
}

const cartBar = document.getElementById('cartBar');
const cartCount = document.getElementById('cartCount');
const overlay = document.getElementById('overlay');
const selectedList = document.getElementById('selectedList');
const fullNameInput = document.getElementById('fullName');
const nameError = document.getElementById('nameError');
const sendBtn = document.getElementById('sendModal');
const copyBtn = document.getElementById('copyModal');
const copyToast = document.getElementById('copyToast');

function updateCartBar(){
  if(selected.size > 0){
    cartBar.classList.add('show');
    cartCount.textContent = selected.size + ' بازی انتخاب شده';
  }else{
    cartBar.classList.remove('show');
  }
}

function renderSelectedList(){
  selectedList.innerHTML = '';
  selected.forEach(name => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = name.replace(/\s*\(.*?\)\s*/g,'');
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', () => {
      selected.delete(name);
      const btn = btnByName[name];
      if(btn){ btn.classList.remove('selected'); btn.textContent = '+ افزودن به لیست'; }
      renderSelectedList();
      updateCartBar();
      if(selected.size === 0) overlay.classList.remove('show');
    });
    li.appendChild(span);
    li.appendChild(removeBtn);
    selectedList.appendChild(li);
  });
}

function clearAllSelections(){
  selected.forEach(name => {
    const btn = btnByName[name];
    if(btn){ btn.classList.remove('selected'); btn.textContent = '+ افزودن به لیست'; }
  });
  selected.clear();
  updateCartBar();
  overlay.classList.remove('show');
}
document.getElementById('clearCartBtn').addEventListener('click', clearAllSelections);

document.getElementById('cartBtn').addEventListener('click', () => {
  renderSelectedList();
  nameError.textContent = '';
  overlay.classList.add('show');
});

document.getElementById('closeModal').addEventListener('click', () => {
  overlay.classList.remove('show');
});

overlay.addEventListener('click', (e) => {
  if(e.target === overlay) overlay.classList.remove('show');
});

function validateName(){
  const name = fullNameInput.value.trim();
  if(name.length < 3){
    nameError.textContent = 'لطفاً نام و نام خانوادگی رو کامل وارد کنید.';
    fullNameInput.style.borderColor = 'var(--danger)';
    return null;
  }
  if(/\d/.test(name)){
    nameError.textContent = 'نام نباید شامل عدد باشه.';
    fullNameInput.style.borderColor = 'var(--danger)';
    return null;
  }
  nameError.textContent = '';
  fullNameInput.style.borderColor = 'var(--border)';
  return name;
}

function buildMessage(name){
  const gameLines = Array.from(selected)
    .map(n => n.replace(/\s*\(.*?\)\s*/g,''))
    .join('\n');
  return `مشخصات مشتری: ${name}\n\nبازی‌های درخواستی:\n${gameLines}`;
}

sendBtn.addEventListener('click', () => {
  const name = validateName();
  if(!name || selected.size === 0) return;
  const body = buildMessage(name);
  window.location.href = `sms:${SMS_NUMBER}?body=${encodeURIComponent(body)}`;
});

copyBtn.addEventListener('click', async () => {
  const name = validateName();
  if(!name || selected.size === 0) return;
  const body = buildMessage(name);
  try{
    await navigator.clipboard.writeText(body);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = body;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  copyToast.classList.add('show');
  setTimeout(() => copyToast.classList.remove('show'), 2000);
});

// ---- render / filter / sort ----
function rebuildGrid(){
  grid.innerHTML = '';
  let list = games.slice();
  if(activeSort === 'alpha'){
    list.sort((a,b) => a.n.localeCompare(b.n));
  }
  list.forEach(g => makeCard(g));
  attachObservers();
  applyFilters();
}

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  let visibleCount = 0;
  document.querySelectorAll('.card').forEach(card => {
    const matchName = card.dataset.name.includes(q);
    const matchGenre = activeGenre === 'همه' || card.dataset.genre === activeGenre;
    const matchConsole = card.dataset.console === activeConsole;
    const show = matchName && matchGenre && matchConsole;
    card.style.display = show ? '' : 'none';
    if(show) visibleCount++;
  });
  emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
  document.getElementById('count').textContent = visibleCount + ' بازی';
}
searchInput.addEventListener('input', applyFilters);

// ---- cover loading (lazy + cached) ----
const CACHE_KEY = 'ps4_cover_cache_v1';
let coverCache = {};
try{ coverCache = JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; }catch(e){ coverCache = {}; }

async function fetchCover(name){
  if(coverCache[name] !== undefined) return coverCache[name];
  const query = encodeURIComponent(name);
  const url = `https://en.wikipedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${query}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=300&format=json`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    const pages = data.query && data.query.pages;
    const page = pages ? Object.values(pages)[0] : null;
    const src = page && page.thumbnail ? page.thumbnail.source : null;
    coverCache[name] = src;
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(coverCache)); }catch(e){}
    return src;
  }catch(e){
    return null;
  }
}

async function loadOne(name, wrapEl){
  if(wrapEl.dataset.loaded) return;
  wrapEl.dataset.loaded = '1';
  const src = await fetchCover(name);
  if(src){
    const img = document.createElement('img');
    img.src = src;
    img.onerror = () => { wrapEl.dataset.loaded = ''; };
    const badge = wrapEl.querySelector('.new-badge');
    wrapEl.innerHTML = '';
    wrapEl.appendChild(img);
    if(badge) wrapEl.appendChild(badge);
  }
}

let observer;
function attachObservers(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const name = entry.target.dataset.name2;
        loadOne(name, entry.target);
        observer.unobserve(entry.target);
      }
    });
  }, { rootMargin: '400px 0px' });

  Object.keys(coverMap).forEach(name => {
    const el = coverMap[name];
    el.dataset.name2 = name;
    observer.observe(el);
  });
}

// ---- popular strip ----
const popularStrip = document.getElementById('popularStrip');
function buildPopularStrip(){
  popularStrip.innerHTML = '';
  Object.keys(trailers).forEach(name => {
    const game = games.find(g => g.n === name && g.c === activeConsole);
    if(!game) return;
    const cleanName = name.replace(/\s*\(.*?\)\s*/g,'');
    const pc = document.createElement('div');
    pc.className = 'pop-card';
    const pcCover = document.createElement('div');
    pcCover.className = 'pop-cover';
    pcCover.innerHTML = placeholderSVG;
    const pcTitle = document.createElement('div');
    pcTitle.className = 'pop-title';
    pcTitle.textContent = cleanName;
    pc.appendChild(pcCover);
    pc.appendChild(pcTitle);
    pc.addEventListener('click', () => {
      const target = document.getElementById('g-' + game.c.toLowerCase() + '-' + slug(name));
      if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
    });
    popularStrip.appendChild(pc);

    // reuse the same cover cache/fetch for the popular strip thumbnail
    fetchCover(name).then(src => {
      if(src){
        const img = document.createElement('img');
        img.src = src;
        pcCover.innerHTML = '';
        pcCover.appendChild(img);
      }
    });
  });
}
buildPopularStrip();

// ---- alphabet jump nav ----
const alphaNav = document.getElementById('alphaNav');
function buildAlphaNav(){
  alphaNav.innerHTML = '';
  const consoleGames = games.filter(g => g.c === activeConsole);
  const letters = Array.from(new Set(consoleGames.map(g => g.n[0].toUpperCase()))).sort();
  letters.forEach(letter => {
    const btn = document.createElement('button');
    btn.textContent = letter;
    btn.addEventListener('click', () => {
      const match = consoleGames
        .slice()
        .sort((a,b) => a.n.localeCompare(b.n))
        .find(g => g.n[0].toUpperCase() === letter);
      if(match){
        const target = document.getElementById('g-' + match.c.toLowerCase() + '-' + slug(match.n));
        if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
    alphaNav.appendChild(btn);
  });
}
buildAlphaNav();

// ---- theme toggle (dark/light) ----
const themeToggle = document.getElementById('themeToggle');
const THEME_KEY = 'ps4_theme';

function applyTheme(theme){
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(theme === 'light'){
    document.documentElement.setAttribute('data-theme', 'light');
    themeToggle.textContent = '☀️';
    if(metaTheme) metaTheme.setAttribute('content', '#f3f4f6');
  }else{
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙';
    if(metaTheme) metaTheme.setAttribute('content', '#0f1115');
  }
}

let savedTheme = 'dark';
try{ savedTheme = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}
applyTheme(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});
